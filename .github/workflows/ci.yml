name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - name: Start preview server for smoke test
        run: npx wrangler pages dev dist --d1=hypnosis-db --local --ip 127.0.0.1 --port 3000 > /tmp/wrangler-pages-dev.log 2>&1 &
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "preview server is up"
              exit 0
            fi
            sleep 2
          done
          echo "preview server did not become healthy in time"
          tail -n 50 /tmp/wrangler-pages-dev.log || true
          exit 1
      - run: npm test --if-present
